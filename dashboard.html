<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Lịch Hẹn Hò ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #007e33;
            font-size: 2.8rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.15rem;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .time-box {
            background: #e8f5e9;
            border: 2px dashed #4caf50;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-block;
            background-color: #ff3366;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tin Vui Cho Bạn! 🎉</h1>
        <p>Em iu đã đồng ý đi chơi Chủ Nhật này với bạn rồi nhé! Khung giờ đã được chọn là:</p>
        
        <div class="time-box" id="displayTime">
            Đang tải thông tin...
        </div>

        <div class="status-badge">Trạng thái: Đã chốt đơn thành công! ❤️</div>
    </div>

    <script>
        // Đọc thông số giờ từ đường dẫn URL (ví dụ: dashboard.html?time=16:00)
        const urlParams = new URLSearchParams(window.location.search);
        const time = urlParams.get('time');
        const displayTimeDiv = document.getElementById('displayTime');

        if (time) {
            displayTimeDiv.innerHTML = `⏰ Lúc ${time} Chủ Nhật`;
        } else {
            displayTimeDiv.innerHTML = `⚠️ Chưa nhận được thông tin giờ hẹn.`;
        }
    </script>
</body>
</html>
